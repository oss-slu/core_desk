services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coredesk_e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coredesk_e2e"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_BUCKET: coredesk-e2e
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$${AWS_ACCESS_KEY_ID}" "$${AWS_SECRET_ACCESS_KEY}"; do
          sleep 1
        done
        mc mb -p local/"$${AWS_BUCKET}" || true
        mc anonymous set download local/"$${AWS_BUCKET}" || true

  app:
    build:
      context: ../..
      dockerfile: Dockerfile.e2e
    env_file:
      - ./.env.e2e
    environment:
      NODE_ENV: production
      PORT: 3030
      SAML_ALLOW_UNSIGNED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "3030:3030"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3030/health"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  minio_data:
