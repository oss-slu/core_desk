services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coredesk_e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coredesk_e2e"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:latest
    container_name: localstack_s3
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=us-east-1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack-init:
    image: amazon/aws-cli:latest
    container_name: localstack_init
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url=http://localstack:4566 s3 mb s3://test-bucket;
      exit 0;
      "

  app:
    build:
      context: ../..
      dockerfile: Dockerfile.e2e
    env_file:
      - ./.env.e2e
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://test_user:test_password@db:5432/test_db
      - PORT=3030
      # AWS S3 variables pointing to LocalStack
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
      - S3_ENDPOINT=http://localstack:4566
      - S3_BUCKET=test-bucket
      - S3_FORCE_PATH_STYLE=true
      - SAML_ALLOW_UNSIGNED="true"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    ports:
      - "3030:3030"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3030/health"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  minio_data:
