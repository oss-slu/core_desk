services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coredesk_e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coredesk_e2e"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  localstack:
    container_name: '${LOCALSTACK_DOCKER_NAME:-localstack-main}'
    # LocalStack's current `latest` image requires an account token at startup.
    # This pinned Community release supports the S3 emulation used by E2E without one.
    image: localstack/localstack:3.8.1
    environment:
      - DEBUG=${DEBUG:-0}
      - PERSISTENCE=${PERSISTENCE:-0}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - '${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack'
      - '/var/run/docker.sock:/var/run/docker.sock'

  app:
    build:
      context: ../..
      dockerfile: Dockerfile.e2e
    env_file:
      - ./.env.e2e
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/coredesk_e2e?schema=public
      - PORT=3030
      # AWS S3 variables pointing to LocalStack
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_REGION=us-east-1
      - AWS_ENDPOINT=http://localstack:4566
      - AWS_BUCKET=coredesk-e2e
      - S3_FORCE_PATH_STYLE=true
      - SAML_ALLOW_UNSIGNED="true"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    ports:
      - "3030:3030"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3030/health"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
