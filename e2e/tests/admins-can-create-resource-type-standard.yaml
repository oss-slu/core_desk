# yaml-language-server: $schema=https://raw.githubusercontent.com/jackcrane/cypress-yaml-plugin/main/schema.json

name: Admins can create resource type within standard flow
seedFile: fixtures/users.sql

steps:
  - open: /

  - setViewport:
      width: 1280
      height: 720

  - authenticateUser:
      email: admin@coredesk-test.slu.edu

  # -------------------- CREATE SHOP --------------------

  - tapOn:
      text: Shops

  - tapOn:
      text: Create Shop

  - typeText:
      placeholder: e.g. South Campus Shop
      text: E2E Test Shop

  - tapOn:
      text: Submit

  - waitFor: 800

  - assertVisible:
      text: E2E Test Shop

  # -------------------- CREATE JOB --------------------

  - tapOn:
      text: E2E Test Shop

  - waitFor: 300

  - tapOn:
      text: Jobs

  - waitFor: 300

  - tapOn:
      text: Create Job

  - waitFor: 500

  - typeText:
      placeholder: e.g. Wind Mill Assembly
      text: E2E Test Job

  - tapOn:
      text: Submit
      exact: true

  - waitFor: 1200

  - assertVisible:
      text: Back to jobs

  - tapOn:
      text: Back to jobs

  - waitFor: 500

  - assertVisible:
      text: E2E Test Job

  # -------------------- RESOURCES --------------------

  - tapOn:
      text: Resources

  - waitFor: 400

  - assertVisible:
      text: Resources

  - tapOn:
      text: Add...

  - waitFor: 500

  - tapOn:
      text: Add Resource Type

  - waitFor: 800

  - assertVisible:
      text: Create a new Resource Type

  - assertVisible:
      placeholder: FDM 3d Printer

  - typeText:
      placeholder: FDM 3d Printer
      text: Test Resource Type

  - tapOn:
      text: Submit
      exact: true

  - waitFor: 1200

  # -------------------- MATERIALS  --------------------

  - tapOn:
      text: Resource options

  - waitFor: 1200   # allow dropdown animation/state change

  - assertVisible:
      parent: ".dropdown-menu.show"
      text: Add Material
      timeout: 8000

  - tapOn:
      parent: ".dropdown-menu.show"
      text: Add Material

  - waitFor: 800

  - typeText:
      parent: ".modal.show"
      placeholder: Acrylic, PLA, Pinewood
      text: Pinewood

  - typeText:
      parent: ".modal.show"
      placeholder: Stratasys, BASF, Generic
      text: Generic

  - tapOn:
      parent: ".modal.show"
      text: Submit
      exact: true

  - waitFor: 800

  - selectFile:
      selector: 'input[type="file"][name="file"]'
      filePath: cypress/fixtures/test-image.png

  - tapOn:
      text: Upload
      exact: true

  - waitFor: 1200

  - assertVisible:
      selector: "#carousel-sample img"

  - tapOn:
      text: Resource options

  - waitFor: 1200   # allow dropdown animation/state change


  - assertVisible:
      parent: ".dropdown-menu.show"
      text: Add Resource
      timeout: 8000

  - tapOn:
      parent: ".dropdown-menu.show"
      text: Add Resource

  - waitFor: 800


  - typeText:
      parent: ".modal.show"
      placeholder: Bambu Lab X1C
      text: Lab X1C


  - tapOn:
      parent: ".modal.show"
      text: Submit
      exact: true


  - waitFor: 800

  - selectFile:
      selector: 'input[type="file"][name="file"]'
      filePath: cypress/fixtures/test-image.png

  - tapOn:
      text: Upload
      exact: true

  - waitFor: 1200

  - assertVisible:
      selector: "#carousel-sample img"

  - tapOn:
      text: Resource options

  - waitFor: 1200   # allow dropdown animation/state change

