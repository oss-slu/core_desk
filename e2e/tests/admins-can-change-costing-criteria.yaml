# yaml-language-server: $schema=https://raw.githubusercontent.com/jackcrane/cypress-yaml-plugin/main/schema.json

name: Admins can change costing criteria and verify job costing
seedFile: fixtures/users.sql

steps:
  - open: /
  - setViewport:
      width: 1280
      height: 720
  - authenticateUser:
      email: admin@coredesk-test.slu.edu

  # -------------------- CREATE SHOP --------------------

  - tapOn:
      text: Shops

  - tapOn:
      text: Create Shop

  - typeText:
      placeholder: e.g. South Campus Shop
      text: E2E Test Shop

  - tapOn:
      text: Submit

  - waitFor: 800

  - assertVisible:
      text: E2E Test Shop

  # -------------------- CREATE JOB --------------------

  - tapOn:
      text: E2E Test Shop

  - waitFor: 300

  - tapOn:
      text: Jobs

  - waitFor: 300

  - tapOn:
      text: Create Job

  - waitFor: 500

  - typeText:
      placeholder: e.g. Wind Mill Assembly
      text: E2E Test Job

  - tapOn:
      text: Submit
      exact: true

  - waitFor: 1200

  - assertVisible:
      text: Back to jobs

  - tapOn:
      text: Back to jobs

  - waitFor: 500

  - assertVisible:
      text: E2E Test Job

  # -------------------- RESOURCES --------------------

  - tapOn:
      text: Resources

  - waitFor: 400

  - assertVisible:
      text: Resources

  - tapOn:
      text: Add...

  - waitFor: 500

  - tapOn:
      text: Add Resource Type

  - waitFor: 800

  - assertVisible:
      text: Create a new Resource Type

  - assertVisible:
      placeholder: FDM 3d Printer

  - typeText:
      placeholder: FDM 3d Printer
      text: Test Resource Type

  - tapOn:
      text: Submit
      exact: true

  - waitFor: 1200

  # -------------------- MATERIALS  --------------------

  - tapOn:
      text: Resource options

  - waitFor: 1200   # allow dropdown animation/state change

  - assertVisible:
      parent: ".dropdown-menu.show:visible"
      text: Add Material
      timeout: 8000

  - tapOn:
      parent: ".dropdown-menu.show:visible"
      text: Add Material

  - waitFor: 800

  - typeText:
      parent: ".modal.show"
      placeholder: Acrylic, PLA, Pinewood
      text: Pinewood

  - typeText:
      parent: ".modal.show"
      placeholder: Stratasys, BASF, Generic
      text: Generic

  - tapOn:
      parent: ".modal.show"
      text: Submit
      exact: true

  - waitFor: 800

  - selectFile:
      selector: 'input[type="file"]'
      filePath: cypress/fixtures/test-image.png

  - tapOn:
      text: Upload
      exact: true

  - waitFor: 1200

  - assertVisible:
      selector: "#carousel-sample img"

  - tapOn:
      text: Resources

  - waitFor: 1200   # allow dropdown animation/state change


  - tapOn:
      text: Resource options

  - waitFor: 1200   # allow dropdown animation/state change


  - assertVisible:
      parent: ".dropdown-menu.show:visible"
      text: Add Resource
      timeout: 8000

  - tapOn:
      parent: ".dropdown-menu.show:visible"
      text: Add Resource

  - waitFor: 800


  - typeText:
      parent: ".modal.show"
      placeholder: Bambu Lab X1C
      text: Lab X1C


  - tapOn:
      parent: ".modal.show"
      text: Submit
      exact: true


  - waitFor: 800

  - selectFile:
      selector: 'input[type="file"]'
      filePath: cypress/fixtures/test-image.png

  - tapOn:
      text: Upload
      exact: true

  - waitFor: 1200

  - assertVisible:
      selector: "#carousel-sample img"

  - tapOn:
      text: Resource

  - waitFor: 1200   # allow dropdown animation/state change

  - assertVisible:
      text: Pinewood

  - assertVisible: 
      text: Lab X1C

# -------------------- OPEN COSTING CRITERIA MODAL --------------------

  - tapOn:
      text: Resource options

  - waitFor: 1200

  - assertVisible:
      parent: ".dropdown-menu.show:visible"
      text: Edit Costing Criteria
      timeout: 8000

  - tapOn:
      parent: ".dropdown-menu.show:visible"
      text: Edit Costing Criteria

  - waitFor: 800

  - assertVisible:
      parent: ".modal.show"
      text: E2E Test Resource Type Costing Criteria

# -------------------- ADD/EDIT COSTING CRITERION --------------------

  - typeText:
      parent: ".modal.show"
      placeholder: Material quantity
      text: E2E Test Costing Criterion

  - waitFor: 300

  - tapOn:
      parent: ".modal.show"
      text: Save Costing Criteria
      
  - waitFor: 1200

  - assertVisible:
      text: E2E Test Costing Criterion

# -------------------- VERIFY DEFAULT ENABLED CRITERIA --------------------

  - tapOn:
      text: Resource options

  - waitFor: 1200

  - assertVisible:
      parent: ".dropdown-menu.show:visible"
      text: Edit Costing Criteria
      timeout: 8000

  - tapOn:
      parent: ".dropdown-menu.show:visible"
      text: Edit Costing Criteria

  - waitFor: 800

  - assertVisible:
      parent: ".modal.show"
      text: Resource Time

  - assertVisible:
      parent: ".modal.show"
      text: Processing Time

  - assertVisible:
      parent: ".modal.show"
      text: Unit runs

  - assertVisible:
      parent: ".modal.show"
      text: Secondary Material quantity

# -------------------- DISABLE A DEFAULT CRITERION --------------------

  - tapOn:
      parent: ".modal.show"
      text: Secondary Material quantity

  - waitFor: 300

  - tapOn:
      parent: ".modal.show"
      text: Save Costing Criteria

  - waitFor: 1200

  - assertVisible:
      parent: ".modal.show"
      text: Secondary Material quantity

# -------------------- VERIFY DISABLED CRITERION MOVED TO BOTTOM --------------------

  - tapOn:
      text: Resource options

  - waitFor: 1200

  - assertVisible:
      parent: ".dropdown-menu.show:visible"
      text: Edit Costing Criteria
      timeout: 8000

  - tapOn:
      parent: ".dropdown-menu.show:visible"
      text: Edit Costing Criteria

  - waitFor: 800

  - assertVisible:
      parent: ".modal.show"
      text: Disabled criteria

  - assertVisible:
      parent: ".modal.show"
      text: Secondary Material quantity

# -------------------- RE-ENABLE THE CRITERION --------------------

  - tapOn:
      parent: ".modal.show"
      text: Secondary Material quantity

  - waitFor: 300

  - tapOn:
      parent: ".modal.show"
      text: Save Costing Criteria

  - waitFor: 1200

  - assertVisible:
      parent: ".modal.show"
      text: Secondary Material quantity

# -------------------- VERIFY RE-ENABLED CRITERION MOVED TO TOP --------------------

  - tapOn:
      text: Resource options

  - waitFor: 1200

  - assertVisible:
      parent: ".dropdown-menu.show:visible"
      text: Edit Costing Criteria
      timeout: 8000

  - tapOn:
      parent: ".dropdown-menu.show:visible"
      text: Edit Costing Criteria

  - waitFor: 800

  - assertNotVisible:
      parent: ".modal.show"
      text: Disabled criteria

# -------------------- CREATE JOB --------------------

  - tapOn:
      text: E2E Test Shop

  - waitFor: 200

  - tapOn:
      text: Jobs

  - waitFor: 200

  - tapOn:
      text: Create Job

  - waitFor: 200

  - typeText:
      placeholder: e.g. Wind Mill Assembly
      text: E2E Test Job

  - tapOn:
      text: Submit
      exact: true

  - waitFor: 1200

  - assertVisible:
      text: Back to jobs

  - tapOn:
      text: Back to jobs

  - waitFor: 300

  - assertVisible:
      text: E2E Test Job

# -------------------- OPEN JOB COSTING --------------------

  - tapOn:
      text: E2E Test Job
  - waitFor: 300
  - tapOn:
      text: Costing
  - waitFor: 300
  - assertVisible:
      text: Project-wide costing

# -------------------- VERIFY ENABLED CRITERIA IN COSTING --------------------

  - tapOn:
      text: Add additional cost
  - waitFor: 300
  - tapOn:
      text: E2E Test Resource Type
  - waitFor: 300
  - tapOn:
      text: E2E Test Resource
  - waitFor: 300
  - tapOn:
      text: E2E Test Material
  - waitFor: 300
  - assertVisible:
      text: Resource Time
  - assertVisible:
      text: Processing Time
  - assertVisible:
      text: Unit runs
  - assertVisible:
      text: E2E Test Costing Criterion

# -------------------- ENTER VALUES AND CHECK TOTAL --------------------

  - tapOn:
      text: Resource Time
  - typeText:
      placeholder: "0"
      text: "1"
  - typeText:
      placeholder: "0"
      text: "0"

  - tapOn:
      text: Processing Time
  - typeText:
      placeholder: "0"
      text: "0"
  - typeText:
      placeholder: "0"
      text: "30"

  - tapOn:
      text: Unit runs
  - typeText:
      placeholder: "0"
      text: "5"

  - tapOn:
      text: E2E Test Costing Criterion
  - typeText:
      placeholder: "0"
      text: "10"

  - waitFor: 500

  - assertVisible:
      text: $
